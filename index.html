<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Versículo do Dia</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Georgia, "Times New Roman", serif;
      background: transparent;
      color: #333333;
    }

    .versiculo-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      padding: 20px 25px 25px;
    }

    .titulo {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #666666;
      margin-bottom: 14px;
    }

    .linha {
      width: 55px;
      height: 2px;
      background: #777777;
      margin: 0 auto 25px;
    }

    .versiculo {
      font-size: 26px;
      line-height: 1.55;
      font-weight: normal;
      color: #333333;
      margin: 0 auto;
    }

    .referencia {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      font-weight: bold;
      margin-top: 22px;
      color: #555555;
    }

    .erro {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      color: #777777;
    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .versiculo-container {
        padding: 15px 10px 20px;
      }

      .titulo {
        font-size: 13px;
        letter-spacing: 1.5px;
      }

      .linha {
        margin-bottom: 20px;
      }

      .versiculo {
        font-size: 21px;
        line-height: 1.5;
      }

      .referencia {
        font-size: 15px;
        margin-top: 18px;
      }
    }

  </style>
</head>

<body>

  <div class="versiculo-container">

    <div class="titulo">
      VERSÍCULO DO DIA
    </div>

    <div class="linha"></div>

    <div id="versiculo" class="versiculo">
      Carregando...
    </div>

    <div id="referencia" class="referencia"></div>

  </div>

  <script>

    function receberVersiculo(dados) {

      if (dados.sucesso) {

        document.getElementById('versiculo').textContent =
          '“' + dados.versiculo + '”';

        document.getElementById('referencia').textContent =
          dados.referencia;

      } else {

        document.getElementById('versiculo').textContent =
          dados.versiculo;

        document.getElementById('referencia').textContent = '';

      }
    }

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwKtla_Sv2EJim70wQD3TzHiMrG_TPanIDUgZHpsZBVVjTqVuCZ3yDj4b0yCPImY3S3/exec'
      + '?callback=receberVersiculo';

    const script = document.createElement('script');

    script.src = API_URL;

    script.onerror = function() {

      document.getElementById('versiculo').textContent =
        'Não foi possível carregar o versículo.';

      document.getElementById('referencia').textContent = '';

    };

    document.body.appendChild(script);

  </script>

</body>

</html>
