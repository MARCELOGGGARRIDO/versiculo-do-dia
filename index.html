<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Versículo do Dia</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: white;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
    }

    .versiculo {
      font-size: 28px;
      line-height: 1.5;
      margin-top: 30px;
    }

    .referencia {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    .erro {
      font-size: 18px;
      color: #990000;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>VERSÍCULO DO DIA</h1>

    <div id="versiculo" class="versiculo">
      Carregando...
    </div>

    <div id="referencia" class="referencia"></div>

  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwKtla_Sv2EJim70wQD3TzHiMrG_TPanIDUgZHpsZBVVjTqVuCZ3yDj4b0yCPImY3S3/exec';

    fetch(API_URL)
      .then(response => response.json())
      .then(dados => {

        if (dados.sucesso) {

          document.getElementById('versiculo').textContent =
            '“' + dados.versiculo + '”';

          document.getElementById('referencia').textContent =
            dados.referencia;

        } else {

          document.getElementById('versiculo').textContent =
            dados.versiculo;

          document.getElementById('referencia').textContent = '';

        }

      })
      .catch(erro => {

        document.getElementById('versiculo').textContent =
          'Não foi possível carregar o versículo.';

        document.getElementById('referencia').textContent = '';

        console.error(erro);

      });
  </script>

</body>
</html>
