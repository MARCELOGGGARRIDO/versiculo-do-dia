<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mensagem do Dia</title>

  <style>

    body {

      margin: 0;
      padding: 30px;

      background: transparent;

      text-align: center;

    }

    .container {

      max-width: 900px;

      margin: 0 auto;

    }

    .titulo {

      font-family: Arial, sans-serif;

      font-size: 18px;

      font-weight: bold;

      letter-spacing: 1px;

      margin-bottom: 15px;

    }

    .linha {

      width: 80px;

      height: 1px;

      background: #999;

      margin: 0 auto 28px auto;

    }

    .imagem {

      display: none;

      width: 100%;

      max-width: 420px;

      aspect-ratio: 1 / 1;

      object-fit: contain;

      margin: 0 auto 28px;

      border-radius: 8px;

    }

    .versiculo {

      font-family: Georgia, "Times New Roman", serif;

      font-size: 27px;

      line-height: 1.5;

      margin: 0 auto 20px;

    }

    .referencia {

      font-family: Arial, sans-serif;

      font-size: 18px;

      margin-bottom: 10px;

    }

    .erro {

      font-family: Arial, sans-serif;

      font-size: 18px;

      color: #555;

    }

    @media (max-width: 600px) {

      body {

        padding: 20px;

      }

      .imagem {

        max-width: 320px;

      }

      .versiculo {

        font-size: 22px;

      }

      .referencia {

        font-size: 16px;

      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="titulo">
      MENSAGEM DO DIA
    </div>

    <div class="linha"></div>

    <img
      id="imagem"
      class="imagem"
      alt=""
    >

    <div
      id="versiculo"
      class="versiculo"
    >
      Carregando...
    </div>

    <div
      id="referencia"
      class="referencia"
    ></div>

  </div>


  <script>

    /*
     * URL DO SEU APPS SCRIPT
     *
     * Mantenha aqui a mesma URL
     * que você já está utilizando.
     */

    const API_URL =
      'COLE_AQUI_A_URL_DO_SEU_APPS_SCRIPT';


    /*
     * Obtém o número do dia através
     * do parâmetro ?dia=
     *
     * Exemplo:
     *
     * teste.html?dia=279
     *
     */

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const dia =
      parametros.get('dia');


    /*
     * Elementos da página
     */

    const versiculo =
      document.getElementById(
        'versiculo'
      );

    const referencia =
      document.getElementById(
        'referencia'
      );

    const imagem =
      document.getElementById(
        'imagem'
      );


    /*
     * Verifica se o número do dia
     * foi informado.
     */

    if (!dia) {

      versiculo.textContent =
        'Nenhum dia foi informado.';

    }


    /*
     * Verifica se o valor é um
     * número válido entre 1 e 366.
     */

    else if (
      !/^\d+$/.test(dia) ||
      Number(dia) < 1 ||
      Number(dia) > 366
    ) {

      versiculo.textContent =
        'Número do dia inválido.';

    }


    /*
     * Consulta o Apps Script.
     */

    else {

      const script =
        document.createElement(
          'script'
        );


      /*
       * Função que receberá
       * o JSONP do Apps Script.
       */

      window.receberVersiculo =
        function(resultado) {

          if (!resultado.sucesso) {

            versiculo.textContent =
              'Não há mensagem cadastrada para este dia.';

            referencia.textContent =
              '';

            return;

          }


          /*
           * Versículo
           */

          versiculo.textContent =
            resultado.versiculo;


          /*
           * Referência
           */

          referencia.textContent =
            resultado.referencia;


          /*
           * Imagem
           */

          if (resultado.imagem) {

            let fileId = null;


            /*
             * Link no formato:
             *
             * drive.google.com/file/d/ID/view
             */

            const resultadoArquivo =
              resultado.imagem.match(
                /\/file\/d\/([^/]+)/
              );


            if (resultadoArquivo) {

              fileId =
                resultadoArquivo[1];

            }


            /*
             * Link no formato:
             *
             * drive.google.com/open?id=ID
             */

            if (!fileId) {

              const resultadoId =
                resultado.imagem.match(
                  /[?&]id=([^&]+)/
                );


              if (resultadoId) {

                fileId =
                  resultadoId[1];

              }

            }


            /*
             * Mostra a imagem.
             */

            if (fileId) {

              imagem.src =
                'https://drive.google.com/thumbnail?id='
                + fileId
                + '&sz=w1000';

              imagem.style.display =
                'block';

            }

          }

        };


      /*
       * Chamada ao Apps Script.
       *
       * Exemplo:
       *
       * ?dia=279
       */

      script.src =
        API_URL
        + '?dia='
        + encodeURIComponent(dia)
        + '&callback=receberVersiculo';


      document.body.appendChild(
        script
      );

    }

  </script>

</body>

</html>
